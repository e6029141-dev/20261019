
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Shooter Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ゲームを描画するキャンバス -->
    <canvas id="gameCanvas"></canvas>

    <!-- ステージ選択UI -->
    <div id="menu-ui">
        <!-- 追加：タイトルロゴ -->
        <div class="mb-6 text-center w-full overflow-hidden">
            <h1 class="menu-title text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 tracking-wider italic whitespace-nowrap">
                MATH<span class="text-white mx-1 text-2xl">×</span>SHOOTER
            </h1>
            <p class="text-xs font-bold text-gray-400 mt-1 tracking-widest">produced by HONDA</p>
        </div>

        <div class="text-green-400 text-xl font-black mb-4 tracking-widest">SELECT STAGE</div>
        <div class="stage-grid" id="stage-grid-container">
            <!-- JavaScriptで動的に生成されます -->
        </div>
        <button id="boss-btn" class="stage-btn-all locked">ぜんぶの段 (BOSS)</button>
    </div>

    <!-- テンキーUI (HTML要素としてキャンバスの上に重ねる) -->
    <div id="math-ui">
        <div class="text-blue-400 text-sm font-bold mb-1">WARNING: ENEMY SHIELD DETECTED</div>
        <div id="question-text" class="text-white text-4xl font-black mb-2 tracking-widest">? x ?</div>
        <div id="answer-input" class="w-full h-12 bg-gray-900 border-2 border-gray-600 rounded-lg text-right text-white text-3xl font-mono px-3 leading-[44px] mb-2 tracking-widest min-h-[3rem]">
        </div>
        <div id="feedback-text" class="text-red-400 text-sm font-bold h-5"></div>
        
        <div class="keypad-grid">
            <button class="key-btn" data-number="7">7</button>
            <button class="key-btn" data-number="8">8</button>
            <button class="key-btn" data-number="9">9</button>
            <button class="key-btn" data-number="4">4</button>
            <button class="key-btn" data-number="5">5</button>
            <button class="key-btn" data-number="6">6</button>
            <button class="key-btn" data-number="1">1</button>
            <button class="key-btn" data-number="2">2</button>
            <button class="key-btn" data-number="3">3</button>
            <button class="key-btn key-clear" data-action="clear">C</button>
            <button class="key-btn" data-number="0">0</button>
            <button class="key-btn key-submit" data-action="submit">OK</button>
        </div>
    </div>

<script src="script.js"></script>
</body>
</html>
